# Builds the strategic portfolio and publishes the compiled site to the
# gh-pages branch, which GitHub Pages serves at this repository's own URL.
#
# It touches nothing outside ansh-strategic-portfolio/ and has no connection to
# the separate ansh-arora-portfolio repository or site.
name: Deploy strategic portfolio

on:
  push:
    branches: [claude/funny-galileo-dtnvmy]
    paths:
      - 'ansh-strategic-portfolio/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ansh-strategic-portfolio/package-lock.json

      - name: Install dependencies
        working-directory: ansh-strategic-portfolio
        run: npm ci

      # Lint and build gate the publish, so a broken build never goes live.
      - name: Lint
        working-directory: ansh-strategic-portfolio
        run: npm run lint

      - name: Build
        working-directory: ansh-strategic-portfolio
        run: npm run build

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          # .nojekyll stops Pages running the output through Jekyll.
          touch ansh-strategic-portfolio/dist/.nojekyll
          cd ansh-strategic-portfolio/dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site built from ${GITHUB_SHA}"
          # The branch holds only build output, so each deploy replaces it
          # rather than accumulating compiled history.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
